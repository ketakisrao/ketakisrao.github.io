<app-navbar></app-navbar>

<router-outlet></router-outlet>

<!-- Shared Footer -->
<footer class="global-footer">
  <div class="footer-grid">

    <!-- Navigation/Links column -->
    <div class="footer-links">
      <span class="font-label-sm section-label">Connect</span>
      <a class="footer-link text-muted" href="https://linkedin.com" target="_blank"
        rel="noopener noreferrer">LinkedIn</a>
      <a class="footer-link text-muted" href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="footer-link text-muted" href="#" (click)="$event.preventDefault()">Studio</a>
    </div>

    <!-- Location/Status column -->
    <div class="footer-info">
      <span class="font-label-sm section-label">Location</span>
      <p class="text-muted">Available for Global Remote Collaborations.</p>
      <div class="location-box neumorphic-inset" aria-label="Location map visual">
        <svg viewBox="0 0 100 40" class="mini-map" aria-hidden="true">
          <circle cx="30" cy="15" r="2" fill="var(--sys-secondary)" />
          <path d="M10,15 Q30,5 50,25 T90,15" fill="none" stroke="var(--sys-primary)" stroke-width="0.5"
            stroke-dasharray="1 1" />
        </svg>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="footer-bottom-text">
      <span class="font-label-sm text-muted">© 2026 Ketaki Rao. Crafted for Precision.</span>
      <span class="analytics-note text-muted">This site uses privacy-respecting Google Analytics to understand reader engagement.</span>
    </div>
    <div class="footer-badges" aria-hidden="true">
      <span class="material-symbols-outlined icon-badge">verified</span>
      <span class="material-symbols-outlined icon-badge">eco</span>
    </div>
  </div>
</footer>
